<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f2e2b" />
  <title>盐 · 今日聚焦</title>
  <style>
    :root {
      --page-bg: #f4f3f0;
      --surface: #fcfbf8;
      --surface-2: #f7f6f1;
      --accent: #2f2e2b;
      --on-accent: #f4f3f0;
      --text: #232220;
      --text-secondary: #6b665d;
      --text-tertiary: #8c877c;
      --fitness: #bd8a4e;
      --study: #5f7a99;
      --read: #6f8f6a;
      --radius: 18px;
      --shadow: 0 1px 2px rgba(35,34,32,.04), 0 8px 28px rgba(35,34,32,.06);
      --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font);
      display: grid;
      place-items: center;
      padding: 24px;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--fitness), var(--study), var(--read));
    }
    header { margin-bottom: 28px; }
    .date-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
    }
    .day-num {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--accent);
    }
    .day-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .weekday { font-size: 18px; font-weight: 700; color: var(--text-secondary); }
    .greeting { font-size: 13px; color: var(--text-tertiary); }

    section { margin-bottom: 28px; }
    section:last-of-type { margin-bottom: 0; }
    .sec-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--surface-2);
      border-radius: 14px;
      border-left: 4px solid var(--accent);
      transition: transform .12s, background .2s;
    }
    .task:hover { transform: translateX(3px); }
    .task.fitness { border-left-color: var(--fitness); }
    .task.study { border-left-color: var(--study); }
    .task-time {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-tertiary);
      min-width: 44px;
    }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .task-desc { font-size: 12px; color: var(--text-secondary); }
    .task-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      flex-shrink: 0;
    }
    .task.fitness .task-tag { background: var(--fitness); }
    .task.study .task-tag { background: var(--study); }

    .empty {
      padding: 22px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 13px;
      background: var(--surface-2);
      border-radius: 14px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 460px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface-2);
      border-radius: 14px;
      padding: 18px;
    }
    .panel-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 10px; }
    .read-item { display: flex; flex-direction: column; gap: 8px; }
    .read-name { font-size: 15px; font-weight: 700; }
    .read-bar { height: 6px; background: rgba(0,0,0,.06); border-radius: 999px; overflow: hidden; }
    .read-bar > i { display: block; height: 100%; background: var(--read); border-radius: 999px; }
    .read-num { font-size: 12px; color: var(--text-tertiary); }

    .habit-list { display: flex; flex-direction: column; gap: 8px; }
    .habit {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .habit-check {
      width: 18px; height: 18px;
      border: 2px solid var(--border, #e0ded6);
      border-radius: 5px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: .15s;
    }
    .habit-check:hover { border-color: var(--accent); }
    .habit-check.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

    .refresh {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--surface-2);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: .2s;
    }
    .refresh:hover { background: var(--accent); color: var(--on-accent); }
    .refresh svg { width: 16px; height: 16px; }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="refresh" id="refresh" title="刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>

    <header>
      <div class="date-row">
        <div class="day-num" id="dayNum">--</div>
        <div class="day-meta">
          <div class="weekday" id="weekday">--</div>
          <div class="greeting" id="greeting">--</div>
        </div>
      </div>
    </header>

    <section id="tasksSec">
      <div class="sec-title"><span class="dot"></span>今日任务</div>
      <div class="task-list" id="taskList"></div>
    </section>

    <div class="grid-2">
      <section>
        <div class="sec-title"><span class="dot" style="background:var(--read)"></span>阅读进度</div>
        <div class="panel" id="readPanel"></div>
      </section>
      <section>
        <div class="sec-title"><span class="dot" style="background:var(--accent)"></span>习惯打卡</div>
        <div class="panel" id="habitPanel"></div>
      </section>
    </div>

    <div class="footer" id="quote"></div>
  </div>

  <script>
    const STORAGE_KEY = "workbench-yan-v3";
    const quotes = [
      "新的一周，从把最重要的一件事做好开始。",
      "保持节奏，稳一点也没关系。",
      "把大目标拆小，今天只推进一步。",
      "坚持到一半时最难，也最值得。",
      "收个尾，给这一周一个交代。",
      "允许自己慢下来，好好休息也是正事。",
      "复盘一下，为下一周留点方向。"
    ];

    function $(s){ return document.querySelector(s); }
    function pad(n){ return String(n).padStart(2,"0"); }

    function loadData(){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      try { return JSON.parse(raw); } catch(e){ return null; }
    }

    function todayStr(){
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    function render(){
      const now = new Date();
      $("#dayNum").textContent = pad(now.getDate());
      $("#weekday").textContent = `${now.getMonth()+1}月 · 周${"日一二三四五六"[now.getDay()]}`;

      const h = now.getHours();
      let greet = "早安";
      if(h >= 11) greet = "上午好";
      if(h >= 13) greet = "下午好";
      if(h >= 18) greet = "晚上好";
      $("#greeting").textContent = greet;
      $("#quote").textContent = quotes[now.getDay()] || quotes[0];

      const data = loadData();
      if(!data){
        $("#taskList").innerHTML = '<div class="empty">未检测到工作台数据，请先在主工作台创建记录。</div>';
        $("#readPanel").innerHTML = '<div class="empty">暂无</div>';
        $("#habitPanel").innerHTML = '<div class="empty">暂无</div>';
        return;
      }

      // 今日任务（日程）
      const schedule = Array.isArray(data.schedule) ? data.schedule : [];
      const today = todayStr();
      const todays = schedule
        .filter(i => i.date === today)
        .sort((a,b) => (a.time||"").localeCompare(b.time||""));

      if(todays.length === 0){
        $("#taskList").innerHTML = '<div class="empty">今天暂无安排，去工作台添加吧。</div>';
      } else {
        $("#taskList").innerHTML = todays.map(item => {
          const cls = item.cat === "健身" ? "fitness" : (item.cat === "学习" ? "study" : "");
          return `
            <div class="task ${cls}">
              <div class="task-time">${item.time || "--"}</div>
              <div class="task-body">
                <div class="task-title">${escapeHtml(item.title)}</div>
                ${item.content ? `<div class="task-desc">${escapeHtml(item.content)}</div>` : ""}
              </div>
              <div class="task-tag">${item.cat || "事项"}</div>
            </div>
          `;
        }).join("");
      }

      // 阅读进度
      const reads = Array.isArray(data.read) ? data.read : [];
      if(reads.length === 0){
        $("#readPanel").innerHTML = '<div class="empty">暂无阅读记录</div>';
      } else {
        const item = reads[0];
        const pct = Math.min(100, Math.round((item.current||0) / (item.target||1) * 100));
        $("#readPanel").innerHTML = `
          <div class="read-item">
            <div class="read-name">${escapeHtml(item.title)}</div>
            <div class="read-bar"><i style="width:${pct}%"></i></div>
            <div class="read-num">${item.current||0} / ${item.target||0} ${item.unit||""} · ${pct}%</div>
          </div>
        `;
      }

      // 习惯打卡
      const checkins = Array.isArray(data.checkin) ? data.checkin : [];
      if(checkins.length === 0){
        $("#habitPanel").innerHTML = '<div class="empty">暂无习惯打卡</div>';
      } else {
        $("#habitPanel").innerHTML = `<div class="habit-list">${checkins.map(h => `
          <label class="habit">
            <span class="habit-check ${h.done ? "done" : ""}">${h.done ? "✓" : ""}</span>
            <span>${escapeHtml(h.title)}</span>
          </label>
        `).join("")}</div>`;
      }
    }

    function escapeHtml(s){
      return String(s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    $("#refresh").onclick = render;

    // 每分钟刷新一次（时间/问候变化）
    setInterval(render, 60000);

    // 监听同页面的 localStorage 变化（多标签同步）
    window.addEventListener("storage", e => {
      if(e.key === STORAGE_KEY) render();
    });

    render();
  </script>
</body>
</html>
